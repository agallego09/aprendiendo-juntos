<!DOCTYPE html>
<html lang="en">
<head>
<div class="parent">
    <div class="div1">1</div>
    <div class="div2">2</div>
    <div class="div3">3</div>
    <div class="div4">4</div>
    <div class="div5">5</div>
    <div class="div7">7</div>
    <div class="div8">8</div>
    <div class="div9">9</div>
    <div class="div10">10</div>
    <div class="div12">12</div>
    <div class="div14">14</div>
</div>
<style>
.parent {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
    background-color: rgb(58, 16, 85);
    border-radius: 10px;
}
    
.div1 {
    background-color: aqua;
    border-radius: 10px;}
.div2 {
    grid-column-start: 5;
    grid-row-start: 1;
    background-color: aqua;
    border-radius: 10px;
}

.div3 {
    grid-column: span 3 / span 3;
    grid-column-start: 2;
    grid-row-start: 1;
    background-color: aqua;
    border-radius: 10px;
}

.div4 {
    grid-row: span 2 / span 2;
    grid-column-start: 2;
    grid-row-start: 2;
    background-color: aqua;
    border-radius: 10px;
}

.div5 {
    grid-row: span 4 / span 4;
    grid-column-start: 1;
    grid-row-start: 2;
    background-color: aqua;
    border-radius: 10px;
}

.div7 {
    grid-row: span 4 / span 4;
    grid-column-start: 5;
    grid-row-start: 2;
    background-color: aqua;
    border-radius: 10px;
}

.div8 {
    grid-row: span 2 / span 2;
    grid-column-start: 3;
    grid-row-start: 2;
    background-color: aqua;
    border-radius: 10px;
}

.div9 {
    grid-row: span 2 / span 2;
    grid-column-start: 4;
    grid-row-start: 2;
    background-color: aqua;
    border-radius: 10px;
}

.div10 {
    grid-row: span 2 / span 2;
    grid-column-start: 2;
    grid-row-start: 4;
    background-color: aqua;
    border-radius: 10px;
}

.div12 {
    grid-row: span 2 / span 2;
    grid-column-start: 3;
    grid-row-start: 4;
    background-color: aqua;
    border-radius: 10px;
}

.div14 {
    grid-row: span 2 / span 2;
    grid-column-start: 4;
    grid-row-start: 4;
    background-color: aqua;
    border-radius: 10px;
}
</style>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

</div>
</body>
</html>
