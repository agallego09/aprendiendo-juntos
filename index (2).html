        <header class="fixed top-0 w-full bg-blue-600 text-white p-5 shadow-lg z-50">
        <h2 class="text-2xl font-semibold">Aprendiendo Juntos</h2>
        <p class="text-sm">Plataforma Educativa Online</p>
    </header>
    <main class="pt-28 text-center max-w-4xl mx-auto p-4">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Bienvenido a la Plataforma</h1>
        <p class="text-lg text-gray-600">Para soporte o ayuda con inscripciones, pagos o cursos, haz clic en el icono flotante de chat en la esquina inferior derecha.</p>
    </main>

    <!-- 🤖 Icono Flotante del Chatbot -->
    <button id="chat-toggle-btn" class="chat-icon" title="Abrir Chatbot de Soporte">
        <i class="fas fa-comment-dots"></i> 
    </button>

    <!-- 💬 Contenedor Principal del Chatbot -->
    <div id="chatbot-container">
        <div class="chat-header">
            <h3>🤖 Asistente Virtual</h3>
            <button id="chat-close-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="chat-body" id="chat-messages">
            <!-- Mensajes se insertarán aquí por JavaScript -->
        </div>
        <div class="chat-footer">
            <input type="text" id="user-input" placeholder="Escribe tu pregunta..." autocomplete="off">
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Enlaza el archivo de lógica JavaScript (script.js) -->
    <script src="chatbot.js"></script>
</body>
